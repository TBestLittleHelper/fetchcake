<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/labrador-head.png" type="image/x-icon">
  <title>Ninja Chess - Fetchcake</title>
  <link rel="stylesheet" href="src/ninja-chess/ninja-chess.css">
  <link rel="stylesheet" href="src/ninja-chess/chessground.base.css">
  <link rel="stylesheet" href="src/ninja-chess/chessground.brown.css">
  <link rel="stylesheet" href="src/ninja-chess/chessground.cburnett.css">

  <script type="module" src="src/ninja-chess/ninja-chess.ts"></script>
</head>
<body>
  <header>
    <button id="leaderboardButton" command="show-modal" commandfor="leaderboardDialog">🏆</button>
    <h1>Ninja Chess</h1>
    <button id="settingsButton" command="show-modal" commandfor="settingsDialog">⚙️</button>
  </header>
  <dialog id="leaderboardDialog">
     <form method="dialog">
      <div class="dialogHeader">
        <h3>Ninja Chess Leaderboard</h3>
        <button class="dialog-close">✕</button></div>

  </form>
    <table>
    <thead>
      <tr>
        <th>Player</th>
        <th>Squares</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody id="leaderboardBody">
    </tbody>
    </table>
  </dialog>
  <dialog id="settingsDialog">
     <form method="dialog">
    <h2>Settings</h2>

    <label id="settingsDialogLabel" class="setting">
      <input type="checkbox" id="trailToggle" checked>
      Mouse Trail
    </label>
    </form>
  </dialog>
  <main>
    <progress id="ninjaGameProgress" value="0"></progress>
    <div id="ninjaChessContainer">
      <div id="board"></div>
    </div>
  </main>
  <footer>
    <p>The source code is on <a href="https://github.com/TBestLittleHelper/fetchcake" target="_blank" rel="noopener noreferrer">Github</a></p>
  </footer>
</body>
</html>
